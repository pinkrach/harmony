<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harmony — Versions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="version-bar" aria-label="App version">
      <p class="version-brand">Harmony</p>
      <div class="version-switch" role="tablist" aria-label="Choose version">
        <button
          type="button"
          class="version-btn is-active"
          role="tab"
          aria-selected="true"
          data-src="v1/index.html"
          data-version="v1"
        >
          V1
        </button>
        <button
          type="button"
          class="version-btn"
          role="tab"
          aria-selected="false"
          data-src="rachel/index.html"
          data-version="rachel"
        >
          Rachel's Version
        </button>
      </div>
    </header>

    <main class="version-stage">
      <iframe
        id="version-frame"
        class="version-frame"
        src="v1/index.html"
        title="Harmony V1"
      ></iframe>
    </main>

    <script src="app.js"></script>
  </body>
</html>
